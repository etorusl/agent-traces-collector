[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-traces-collector"
version = "0.1.0"
description = "Local AppWorld and GAIA agents with auditable vLLM token accounting"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["httpx>=0.27,<0.28"]

[project.optional-dependencies]
gaia = ["datasets>=4,<5", "huggingface-hub>=0.34,<2", "pypdf>=5,<7", "beautifulsoup4>=4.12,<5", "openpyxl>=3.1,<4", "python-docx>=1.1,<2"]
appworld = ["appworld==0.1.3", "click>=8.1,<8.2", "ipython>=8.18,<9"]
tokenizer = ["transformers>=4.51,<6"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
trace-collector = "agent_traces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_traces"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
